<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>加密貨幣當沖訊號大腦</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

<header class="border-b border-gray-800 bg-gray-900 px-6 py-4 flex flex-wrap justify-between items-center gap-3">
  <div class="flex items-center space-x-3">
    <span class="text-2xl">🧠</span>
    <h1 class="text-xl font-bold tracking-wider text-indigo-400">加密貨幣當沖訊號大腦</h1>
  </div>
  <div class="flex items-center gap-3">
    <span class="text-sm text-gray-400">
      上次分析：<span id="last-update" class="text-indigo-300 font-mono">尚未分析</span>
    </span>
    <button id="analyze-btn"
      class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold
             transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
      <span id="analyze-btn-icon">🔍</span>
      <span id="analyze-btn-label">立即分析</span>
    </button>
  </div>
</header>

<div class="bg-yellow-950/40 border-b border-yellow-800/60 text-yellow-300 text-xs px-6 py-2">
  ⚠️ 本系統<b>不會自動在背景分析</b>，只在你按下「立即分析」時才呼叫一次 OKX／AI API——用量由你自己掌控。
  訊號僅供參考，<b>不會自動下單、不動用任何真實資金</b>；所有內容非投資建議。
</div>

<main class="max-w-7xl mx-auto p-6 space-y-6">

  <section class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-md font-semibold text-gray-300 flex items-center">
        <span class="mr-2">📰</span> AI 即時新聞情緒大腦
      </h2>
      <span id="ai-sentiment" class="px-3 py-1 text-xs font-bold rounded-full bg-gray-800 text-gray-400">
        尚未分析
      </span>
    </div>
    <div class="bg-gray-950 p-4 rounded-lg border border-gray-800 space-y-1">
      <p id="news-headline" class="text-gray-200 text-sm leading-relaxed">按上方「立即分析」開始第一次掃描。</p>
      <p id="news-reason" class="text-gray-500 text-xs leading-relaxed"></p>
    </div>
  </section>

  <section class="space-y-3">
    <h2 class="text-md font-semibold text-gray-300 flex items-center">
      <span class="mr-2">🎯</span> 多空雙向訊號面板（5 分鐘 K 線・20 EMA + 盤整盒子突破）
    </h2>
    <div id="signals-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="bg-gray-900 p-6 rounded-xl border border-gray-800 text-center text-gray-500 col-span-full">
        尚未分析。按右上角「🔍 立即分析」開始篩選 OKX 活躍合約並計算訊號。
      </div>
    </div>
  </section>

</main>

<script>
const API_BASE = window.location.origin.startsWith("file") ? "http://127.0.0.1:8000" : window.location.origin;

const colorStyles = {
  green:  { border: "border-green-600 bg-gradient-to-b from-gray-900 to-green-950/20", badge: "bg-green-500 text-gray-950 font-bold" },
  red:    { border: "border-red-600 bg-gradient-to-b from-gray-900 to-red-950/20",     badge: "bg-red-500 text-white font-bold" },
  yellow: { border: "border-yellow-600",                                                badge: "bg-yellow-600 text-gray-950 font-bold" },
  blue:   { border: "border-indigo-600",                                                badge: "bg-indigo-600 text-white font-bold" },
  gray:   { border: "border-gray-800",                                                  badge: "bg-gray-800 text-gray-300" },
};

const sentimentClass = {
  BULLISH: "px-3 py-1 text-xs font-bold rounded-full bg-green-950 text-green-400 border border-green-800",
  BEARISH: "px-3 py-1 text-xs font-bold rounded-full bg-red-950 text-red-400 border border-red-800",
  NEUTRAL: "px-3 py-1 text-xs font-bold rounded-full bg-gray-800 text-gray-400 border border-gray-700",
};

function fmt(v, d = 4) {
  return (v === null || v === undefined) ? "—" : Number(v).toLocaleString("en-US", { maximumFractionDigits: d });
}

function renderDashboard(data) {
  document.getElementById("last-update").textContent = data.last_update || "尚未分析";

  const sentimentEl = document.getElementById("ai-sentiment");
  sentimentEl.textContent = data.has_run ? `AI 新聞情緒：${data.market_sentiment}` : "尚未分析";
  sentimentEl.className = data.has_run ? (sentimentClass[data.market_sentiment] || sentimentClass.NEUTRAL) : sentimentClass.NEUTRAL;
  document.getElementById("news-headline").textContent = data.news_headline || "—";
  document.getElementById("news-reason").textContent = data.news_reason || "";

  const container = document.getElementById("signals-container");
  container.innerHTML = "";

  if (data.last_error) {
    container.innerHTML = `<div class="bg-gray-900 p-6 rounded-xl border border-red-800 text-center text-red-400 col-span-full">
      分析失敗：${data.last_error}</div>`;
    return;
  }

  if (!data.has_run) {
    container.innerHTML = `<div class="bg-gray-900 p-6 rounded-xl border border-gray-800 text-center text-gray-500 col-span-full">
      尚未分析。按右上角「🔍 立即分析」開始篩選 OKX 活躍合約並計算訊號。</div>`;
    return;
  }

  if (!data.signals || data.signals.length === 0) {
    container.innerHTML = `<div class="bg-gray-900 p-6 rounded-xl border border-gray-800 text-center text-gray-500 col-span-full">
      目前沒有符合流動性／振幅門檻的商品，稍後可以再按一次「立即分析」重新掃描。</div>`;
    return;
  }

  for (const sig of data.signals) {
    const style = colorStyles[sig.color] || colorStyles.gray;
    const card = document.createElement("div");
    card.className = `bg-gray-900 border ${style.border} rounded-xl p-5 shadow-md flex flex-col justify-between space-y-4`;
    card.innerHTML = `
      <div class="flex justify-between items-center gap-2">
        <span class="text-lg font-bold tracking-wide text-white">${sig.name}</span>
        <span class="px-2.5 py-1 text-xs rounded ${style.badge} whitespace-nowrap">${sig.action}</span>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs font-mono bg-gray-950 p-3 rounded-lg border border-gray-800">
        <div class="text-gray-400">最新價格 <span class="text-white block">${fmt(sig.price)}</span></div>
        <div class="text-gray-400">20 EMA <span class="text-indigo-400 block">${fmt(sig.ema)}</span></div>
        <div class="text-gray-400">盒子高點 <span class="text-green-400 block">${fmt(sig.box_high)}</span></div>
        <div class="text-gray-400">盒子低點 <span class="text-red-400 block">${fmt(sig.box_low)}</span></div>
      </div>
      <div class="grid grid-cols-3 gap-2 text-xs font-mono bg-gray-950 p-3 rounded-lg border border-gray-800">
        <div class="text-gray-400">停損 <span class="text-red-400 block font-bold">${fmt(sig.stop_loss)}</span></div>
        <div class="text-gray-400">停利1 <span class="text-green-400 block font-bold">${fmt(sig.take_profit_1)}</span></div>
        <div class="text-gray-400">停利2 <span class="text-green-300 block font-bold">${fmt(sig.take_profit_2)}</span></div>
      </div>
      <div class="text-xs text-gray-500 font-mono">24h 振幅：${fmt(sig.amplitude_pct, 2)}%</div>
      <div class="text-xs text-gray-400 bg-gray-950/50 p-2.5 rounded border border-gray-800/60 leading-relaxed">
        <span class="font-semibold text-indigo-400">大腦研判：</span>${sig.reason}
      </div>`;
    container.appendChild(card);
  }
}

// 頁面載入時只讀「上一次」分析結果（如果有），不會觸發新的分析、不打任何外部 API。
async function loadLastResult() {
  try {
    const res = await fetch(`${API_BASE}/api/v1/dashboard`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    renderDashboard(await res.json());
  } catch (err) {
    console.error("讀取上次分析結果失敗（後端可能還沒啟動）：", err);
  }
}

async function runAnalysis() {
  const btn = document.getElementById("analyze-btn");
  const icon = document.getElementById("analyze-btn-icon");
  const label = document.getElementById("analyze-btn-label");

  btn.disabled = true;
  icon.textContent = "⏳";
  label.textContent = "分析中…";

  try {
    const res = await fetch(`${API_BASE}/api/v1/analyze`, { method: "POST" });
    if (res.status === 409) {
      const body = await res.json();
      alert(body.message || "上一輪分析還在進行中，請稍候。");
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    renderDashboard(await res.json());
  } catch (err) {
    console.error("分析失敗：", err);
    alert(`無法連上後端：${err}\n請確認 uvicorn 是否還在執行中。`);
  } finally {
    btn.disabled = false;
    icon.textContent = "🔍";
    label.textContent = "立即分析";
  }
}

document.getElementById("analyze-btn").addEventListener("click", runAnalysis);
loadLastResult();
</script>
</body>
</html>
